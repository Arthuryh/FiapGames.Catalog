version: '3.9'

services:
  catalog-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fiapgames-catalog-api
    ports:
      - "8082:8082"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Sobrescreve o LocalDB para apontar para o contêiner SQL Server
      ConnectionStrings__CatalogConnection: "Server=sqlserver-catalog,1433;Database=fiapgames_catalog;User Id=sa;Password=${SQLSERVER_SA_PASSWORD:?Set SQLSERVER_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False;Connect Timeout=60;ConnectRetryCount=20;ConnectRetryInterval=5"
      Jwt__Key: "${AUTH_JWT_KEY:?Set AUTH_JWT_KEY}"
      Jwt__Issuer: "FiapGamesApi"
      Jwt__Audience: "FiapGamesClients"
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: "${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}"
    depends_on:
      sqlserver-catalog:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - fiapgames-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: fiapgames-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS}"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - fiapgames-network

  sqlserver-catalog:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fiapgames-catalog-db
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQLSERVER_SA_PASSWORD:?Set SQLSERVER_SA_PASSWORD}"
    ports:
      - "1437:1433"
    volumes:
      - sqlserver-catalog-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SQLSERVER_SA_PASSWORD:?Set SQLSERVER_SA_PASSWORD}' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - fiapgames-network

volumes:
  sqlserver-catalog-data:

networks:
  fiapgames-network:
    name: fiapgames-network
