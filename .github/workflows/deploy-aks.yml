name: Deploy Catalog API to AKS

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-aks-catalog-api
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: rg-fiapgames-prod
  AZURE_SUBSCRIPTION_ID: 64f434dd-5cb0-4c01-971d-7e0e6ba4db9b
  AKS_CLUSTER_NAME: aks-fiapgames-prod
  ACR_LOGIN_SERVER: acrfiapgamesprod64f434dd.azurecr.io
  IMAGE_NAME: catalog-api
  KEY_VAULT_URI: https://kv-fiapgames-64f434dd.vault.azure.net/
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and test
        run: dotnet test FiapGames.Catalog.slnx --configuration Release

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Select subscription and connect to AKS
        run: |
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          az aks get-credentials \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AKS_CLUSTER_NAME" \
            --overwrite-existing

      - name: Log in to ACR
        run: az acr login --name "${ACR_LOGIN_SERVER%%.*}"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Apply config and run database migration
        run: |
          set -euo pipefail
          kubectl apply -f k8s/catalog-api-configmap.yaml
          kubectl apply -f k8s/catalog-api-service-account.yaml
          kubectl rollout status statefulset/rabbitmq --timeout=15m
          kubectl delete job catalog-api-migration --ignore-not-found=true
          sed "s|${ACR_LOGIN_SERVER}/${IMAGE_NAME}:bootstrap|${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${IMAGE_TAG}|g" \
            k8s/catalog-api-migration-job.yaml | kubectl apply -f -
          if ! kubectl wait --for=condition=complete job/catalog-api-migration --timeout=30m; then
            kubectl logs job/catalog-api-migration || true
            exit 1
          fi
          kubectl delete job catalog-api-migration --wait=false

      - name: Deploy rolling update
        run: |
          set -euo pipefail
          kubectl apply -f k8s/catalog-api-service.yaml
          sed "s|${ACR_LOGIN_SERVER}/${IMAGE_NAME}:bootstrap|${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${IMAGE_TAG}|g" \
            k8s/catalog-api-deployment.yaml | kubectl apply -f -
          kubectl rollout status deployment/catalog-api --timeout=10m
          kubectl get service catalog-api -o wide