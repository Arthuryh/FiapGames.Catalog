apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-api
  template:
    metadata:
      labels:
        app: catalog-api
    spec:
      containers:
        - name: catalog-api
          image: fiapgames/catalog-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: catalog-api-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: ASPNETCORE_URLS
              valueFrom:
                configMapKeyRef:
                  name: catalog-api-config
                  key: ASPNETCORE_URLS
            - name: Jwt__Issuer
              valueFrom:
                configMapKeyRef:
                  name: catalog-api-config
                  key: Jwt__Issuer
            - name: Jwt__Audience
              valueFrom:
                configMapKeyRef:
                  name: catalog-api-config
                  key: Jwt__Audience
            - name: RabbitMq__HostName
              valueFrom:
                configMapKeyRef:
                  name: catalog-api-config
                  key: RabbitMq__HostName
            - name: RabbitMq__Port
              valueFrom:
                configMapKeyRef:
                  name: catalog-api-config
                  key: RabbitMq__Port
            - name: ConnectionStrings__FIAPGamesConnection
              valueFrom:
                secretKeyRef:
                  name: catalog-api-secret
                  key: ConnectionStrings__FIAPGamesConnection
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: catalog-api-secret
                  key: Jwt__Key
            - name: RabbitMq__UserName
              valueFrom:
                secretKeyRef:
                  name: catalog-api-secret
                  key: RabbitMq__UserName
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: catalog-api-secret
                  key: RabbitMq__Password
          readinessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 20
