apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: catalog-api
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: catalog-api
      containers:
        - name: catalog-api
          image: acrfiapgamesprod64f434dd.azurecr.io/catalog-api:bootstrap
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: catalog-api-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: ASPNETCORE_URLS
              valueFrom:
                configMapKeyRef:
                  name: catalog-api-config
                  key: ASPNETCORE_URLS
            - name: KeyVaultUri
              value: https://kv-fiapgames-64f434dd.vault.azure.net/
            - name: AZURE_CLIENT_ID
              value: dfff11eb-a350-4ccb-a466-dee3265a9bf1
            - name: Jwt__Issuer
              valueFrom:
                configMapKeyRef:
                  name: catalog-api-config
                  key: Jwt__Issuer
            - name: Jwt__Audience
              valueFrom:
                configMapKeyRef:
                  name: catalog-api-config
                  key: Jwt__Audience
            - name: RabbitMq__HostName
              valueFrom:
                configMapKeyRef:
                  name: catalog-api-config
                  key: RabbitMq__HostName
            - name: RabbitMq__Port
              valueFrom:
                configMapKeyRef:
                  name: catalog-api-config
                  key: RabbitMq__Port
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 10
